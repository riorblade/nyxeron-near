name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test contracts (skipped until contracts/nyxeron exists)
        run: |
          if [ -f contracts/nyxeron/Cargo.toml ]; then
            cd contracts/nyxeron && cargo test
          else
            echo "no contract yet"
          fi
